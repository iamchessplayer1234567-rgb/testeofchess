<!DOCTYPE html>
<html>
<head>
  <title>TesteOfChess</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
    }
    input {
      padding: 8px;
      margin: 10px;
    }
    button {
      padding: 8px 15px;
      cursor: pointer;
    }
    a {
      color: #00ffcc;
      display: block;
      margin: 5px;
    }
  </style>
</head>
<body>

  <h1>TesteOfChess</h1>
  <p>Enter Chess.com Username</p>

  <input type="text" id="username" placeholder="Username">
  <button onclick="loadGames()">Load Games</button>

  <div id="results"></div>

  <script>
    async function loadGames() {
      const username = document.getElementById("username").value.trim();
      const resultDiv = document.getElementById("results");
      resultDiv.innerHTML = "Loading...";

      if (!username) {
        resultDiv.innerHTML = "Enter username.";
        return;
      }

      const now = new Date();
      let allGames = [];

      for (let i = 0; i < 3; i++) {
        const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');

        try {
          const res = await fetch(`https://api.chess.com/pub/player/${username}/games/${year}/${month}`);
          const data = await res.json();
          if (data.games) {
            allGames = allGames.concat(data.games);
          }
        } catch (e) {}
      }

      if (allGames.length === 0) {
        resultDiv.innerHTML = "No games found.";
        return;
      }

      allGames.sort((a, b) => b.end_time - a.end_time);

      const lastTwenty = allGames.slice(0, 20);

      resultDiv.innerHTML = "";

      lastTwenty.forEach((game, index) => {
        const link = document.createElement("a");
        link.href = game.url;
        link.target = "_blank";
        link.textContent = `Game ${index + 1}`;
        resultDiv.appendChild(link);
      });
    }
  </script>

</body>
</html>
